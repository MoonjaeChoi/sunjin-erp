<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C2833;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.content {
  text-align: center;
  padding: 25pt;
}
.main-title {
  color: #FFFFFF;
  font-size: 28pt;
  font-weight: bold;
  margin: 0 0 10pt 0;
}
.subtitle {
  color: #3498DB;
  font-size: 14pt;
  margin: 0 0 30pt 0;
}
.message-box {
  background: #2E4053;
  border-radius: 6pt;
  padding: 20pt 30pt;
  margin-bottom: 30pt;
}
.message {
  color: #FFFFFF;
  font-size: 12pt;
  line-height: 1.8;
  margin: 0;
}
.highlight {
  color: #3498DB;
  font-weight: bold;
}
.contact-section {
  display: flex;
  gap: 30pt;
  justify-content: center;
  margin-bottom: 25pt;
}
.contact-item {
  text-align: center;
}
.contact-label {
  color: #AAB7B8;
  font-size: 9pt;
  margin: 0 0 4pt 0;
}
.contact-value {
  color: #FFFFFF;
  font-size: 11pt;
  font-weight: bold;
  margin: 0;
}
.qa-box {
  background: #3498DB;
  color: #FFFFFF;
  font-size: 14pt;
  font-weight: bold;
  padding: 10pt 25pt;
  border-radius: 20pt;
  display: inline-block;
}
.footer {
  color: #5D6D7E;
  font-size: 8pt;
  margin: 20pt 0 0 0;
}
</style>
</head>
<body>
<div class="content">
  <p class="main-title">감사합니다</p>
  <p class="subtitle">선진인포텍 ERP 시스템 구축 제안</p>
  <div class="message-box">
    <p class="message">
      <span class="highlight">통합 ERP 시스템</span>을 통해 선진인포텍의<br/>
      업무 효율화와 데이터 기반 경영을 함께 실현하겠습니다.
    </p>
  </div>
  <div class="contact-section">
    <div class="contact-item">
      <p class="contact-label">담당자</p>
      <p class="contact-value">ERP 구축팀</p>
    </div>
    <div class="contact-item">
      <p class="contact-label">이메일</p>
      <p class="contact-value">erp@sunjin.net</p>
    </div>
    <div class="contact-item">
      <p class="contact-label">연락처</p>
      <p class="contact-value">02-XXXX-XXXX</p>
    </div>
  </div>
  <div class="qa-box"><p>Q and A</p></div>
  <p class="footer">2026 선진인포텍(주)</p>
</div>
</body>
</html>
