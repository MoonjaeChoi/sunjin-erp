<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: 'Pretendard', Arial, sans-serif;
  display: flex;
  background: #1C2833;
}
.container {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.accent-bar {
  position: absolute; left: 0; top: 0;
  width: 10pt; height: 405pt;
  background: #1ABC9C;
}
.logo-area {
  margin-bottom: 20pt;
}
.logo-text {
  color: #1ABC9C;
  font-size: 14pt;
  font-weight: bold;
  letter-spacing: 2pt;
  margin: 0;
}
h1 {
  color: #FFFFFF;
  font-size: 42pt;
  font-weight: bold;
  margin: 0 0 12pt 0;
  text-align: center;
}
.subtitle {
  color: #AAB7B8;
  font-size: 18pt;
  margin: 0 0 30pt 0;
  text-align: center;
}
.version-badge {
  background: #1ABC9C;
  padding: 8pt 20pt;
  border-radius: 20pt;
}
.version-badge p {
  color: #FFFFFF;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
}
.footer {
  position: absolute;
  bottom: 25pt;
  text-align: center;
  width: 100%;
}
.date {
  color: #7F8C8D;
  font-size: 11pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="container">
  <div class="logo-area">
    <p class="logo-text">SUNJIN INFOTECH</p>
  </div>
  <h1>선진인포텍 ERP V1.0</h1>
  <p class="subtitle">영업 및 업무 관리 통합 시스템 기술 개요</p>
  <div class="version-badge">
    <p>v1.0 Phase 1 완료</p>
  </div>
</div>
<div class="footer">
  <p class="date">2026년 1월</p>
</div>
</body>
</html>
