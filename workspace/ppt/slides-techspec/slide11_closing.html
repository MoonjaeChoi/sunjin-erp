<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: 'Pretendard', Arial, sans-serif;
  display: flex;
  background: #1C2833;
}
.container {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.accent-bar {
  position: absolute; left: 0; top: 0;
  width: 10pt; height: 405pt;
  background: #1ABC9C;
}
h1 {
  color: #FFFFFF;
  font-size: 36pt;
  font-weight: bold;
  margin: 0 0 20pt 0;
  text-align: center;
}
.message-box {
  background: rgba(26, 188, 156, 0.2);
  padding: 20pt 40pt;
  border-radius: 10pt;
  border: 2pt solid #1ABC9C;
  margin-bottom: 30pt;
}
.message-box p {
  color: #1ABC9C;
  font-size: 16pt;
  margin: 0;
  text-align: center;
}
.next-steps {
  text-align: center;
  margin-bottom: 25pt;
}
.next-title {
  color: #AAB7B8;
  font-size: 12pt;
  margin: 0 0 10pt 0;
}
.next-content {
  color: #FFFFFF;
  font-size: 14pt;
  margin: 0;
  line-height: 1.8;
}
.info-box {
  background: rgba(255, 255, 255, 0.1);
  padding: 15pt 30pt;
  border-radius: 8pt;
}
.info-box p {
  color: #AAB7B8;
  font-size: 11pt;
  margin: 5pt 0;
  text-align: center;
}
.highlight {
  color: #1ABC9C;
  font-weight: bold;
}
.footer {
  position: absolute;
  bottom: 25pt;
  text-align: center;
  width: 100%;
}
.company {
  color: #7F8C8D;
  font-size: 10pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="container">
  <h1>Thank You</h1>
  <div class="message-box">
    <p>Phase 1 성공적 완료 | Phase 2 준비 완료</p>
  </div>
  <div class="next-steps">
    <p class="next-title">다음 단계</p>
    <p class="next-content">Phase 2 우선순위 확정 및 개발 착수</p>
  </div>
  <div class="info-box">
    <p><span class="highlight">테스트 서버:</span> http://58.227.121.8:3200</p>
    <p><span class="highlight">문서 버전:</span> v1.0 | <span class="highlight">작성일:</span> 2026-01-28</p>
  </div>
</div>
<div class="footer">
  <p class="company">선진인포텍 ERP V1.0 - 기술 스펙</p>
</div>
</body>
</html>
