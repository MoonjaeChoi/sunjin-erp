<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #1C2833;
  padding: 15pt 35pt;
  display: flex;
  align-items: center;
}
.section-num {
  color: #3498DB;
  font-size: 12pt;
  font-weight: bold;
  margin-right: 15pt;
}
.section-title {
  color: #FFFFFF;
  font-size: 18pt;
  font-weight: bold;
  margin: 0;
}
.content {
  flex: 1;
  padding: 15pt 35pt;
  display: flex;
  gap: 20pt;
}
.left-col {
  flex: 1;
}
.right-col {
  flex: 1.2;
}
.module-header {
  background: #27AE60;
  color: #FFFFFF;
  padding: 10pt 12pt;
  border-radius: 4pt 4pt 0 0;
}
.module-name {
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
}
.module-body {
  background: #F8F9FA;
  border: 1pt solid #E5E8E8;
  border-top: none;
  border-radius: 0 0 4pt 4pt;
  padding: 10pt;
}
.feature-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 6pt;
}
.feature-bullet {
  color: #27AE60;
  font-size: 9pt;
  margin-right: 6pt;
  font-weight: bold;
}
.feature-text {
  color: #1C2833;
  font-size: 9pt;
  margin: 0;
  line-height: 1.3;
}
.gantt-title {
  color: #1C2833;
  font-size: 11pt;
  font-weight: bold;
  margin: 0 0 10pt 0;
}
.gantt-chart {
  background: #F8F9FA;
  border-radius: 4pt;
  padding: 12pt;
}
.gantt-row {
  display: flex;
  align-items: center;
  margin-bottom: 6pt;
}
.gantt-label {
  width: 60pt;
  color: #1C2833;
  font-size: 8pt;
  margin: 0;
}
.gantt-bar-container {
  flex: 1;
  height: 14pt;
  background: #E5E8E8;
  border-radius: 2pt;
  position: relative;
}
.gantt-bar {
  position: absolute;
  height: 100%;
  border-radius: 2pt;
  top: 0;
}
.bar-plan { background: #3498DB; }
.bar-design { background: #9B59B6; }
.bar-dev { background: #27AE60; }
.bar-test { background: #F39C12; }
.bar-deploy { background: #E74C3C; }
.gantt-legend {
  display: flex;
  gap: 10pt;
  margin-top: 10pt;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4pt;
}
.legend-color {
  width: 10pt;
  height: 10pt;
  border-radius: 2pt;
}
.legend-text {
  color: #5D6D7E;
  font-size: 7pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <p class="section-num">03</p>
  <p class="section-title">핵심 모듈 - 프로젝트관리</p>
</div>
<div class="content">
  <div class="left-col">
    <div class="module-header">
      <p class="module-name">프로젝트관리 모듈</p>
    </div>
    <div class="module-body">
      <div class="feature-item">
        <p class="feature-bullet">▸</p>
        <p class="feature-text">프로젝트 생성 및 기본정보 관리</p>
      </div>
      <div class="feature-item">
        <p class="feature-bullet">▸</p>
        <p class="feature-text">WBS 기반 작업 분해 및 일정 수립</p>
      </div>
      <div class="feature-item">
        <p class="feature-bullet">▸</p>
        <p class="feature-text">인력 배정 및 공수 관리</p>
      </div>
      <div class="feature-item">
        <p class="feature-bullet">▸</p>
        <p class="feature-text">진척률 자동 산출 및 모니터링</p>
      </div>
      <div class="feature-item">
        <p class="feature-bullet">▸</p>
        <p class="feature-text">이슈/리스크 등록 및 추적</p>
      </div>
      <div class="feature-item">
        <p class="feature-bullet">▸</p>
        <p class="feature-text">산출물 등록 및 버전 관리</p>
      </div>
      <div class="feature-item">
        <p class="feature-bullet">▸</p>
        <p class="feature-text">프로젝트 수익성 분석 리포트</p>
      </div>
    </div>
  </div>
  <div class="right-col">
    <p class="gantt-title">간트 차트 기반 일정 관리</p>
    <div class="gantt-chart">
      <div class="gantt-row">
        <p class="gantt-label">요구분석</p>
        <div class="gantt-bar-container">
          <div class="gantt-bar bar-plan" style="left: 0%; width: 20%;"></div>
        </div>
      </div>
      <div class="gantt-row">
        <p class="gantt-label">설계</p>
        <div class="gantt-bar-container">
          <div class="gantt-bar bar-design" style="left: 15%; width: 25%;"></div>
        </div>
      </div>
      <div class="gantt-row">
        <p class="gantt-label">개발</p>
        <div class="gantt-bar-container">
          <div class="gantt-bar bar-dev" style="left: 30%; width: 40%;"></div>
        </div>
      </div>
      <div class="gantt-row">
        <p class="gantt-label">테스트</p>
        <div class="gantt-bar-container">
          <div class="gantt-bar bar-test" style="left: 60%; width: 25%;"></div>
        </div>
      </div>
      <div class="gantt-row">
        <p class="gantt-label">배포</p>
        <div class="gantt-bar-container">
          <div class="gantt-bar bar-deploy" style="left: 80%; width: 20%;"></div>
        </div>
      </div>
      <div class="gantt-legend">
        <div class="legend-item">
          <div class="legend-color bar-plan"></div>
          <p class="legend-text">분석</p>
        </div>
        <div class="legend-item">
          <div class="legend-color bar-design"></div>
          <p class="legend-text">설계</p>
        </div>
        <div class="legend-item">
          <div class="legend-color bar-dev"></div>
          <p class="legend-text">개발</p>
        </div>
        <div class="legend-item">
          <div class="legend-color bar-test"></div>
          <p class="legend-text">테스트</p>
        </div>
        <div class="legend-item">
          <div class="legend-color bar-deploy"></div>
          <p class="legend-text">배포</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
