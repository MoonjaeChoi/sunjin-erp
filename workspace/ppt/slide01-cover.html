<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C2833;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.content {
  text-align: center;
  padding: 30pt;
}
.company-name {
  color: #3498DB;
  font-size: 14pt;
  letter-spacing: 2pt;
  margin: 0 0 15pt 0;
}
.main-title {
  color: #FFFFFF;
  font-size: 36pt;
  font-weight: bold;
  margin: 0 0 10pt 0;
}
.subtitle {
  color: #AAB7B8;
  font-size: 16pt;
  margin: 0 0 30pt 0;
}
.divider {
  width: 80pt;
  height: 3pt;
  background: #3498DB;
  margin: 0 auto 30pt auto;
}
.date {
  color: #5D6D7E;
  font-size: 12pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="content">
  <p class="company-name">SUNJIN INFOTECH</p>
  <p class="main-title">ERP 시스템 구축 제안서</p>
  <p class="subtitle">통합 경영 정보 시스템 도입을 통한 업무 혁신</p>
  <div class="divider"></div>
  <p class="date">2026년 1월</p>
</div>
</body>
</html>
