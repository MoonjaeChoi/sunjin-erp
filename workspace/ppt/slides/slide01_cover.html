<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  background: #1C2833;
}
.container {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.accent-bar {
  position: absolute; top: 0; left: 0;
  width: 8pt; height: 405pt;
  background: #1ABC9C;
}
.title-box {
  text-align: center;
  margin-bottom: 30pt;
}
h1 {
  color: #FFFFFF;
  font-size: 36pt;
  font-weight: bold;
  margin: 0 0 10pt 0;
}
.subtitle {
  color: #1ABC9C;
  font-size: 20pt;
  margin: 0 0 20pt 0;
}
.desc {
  color: #AAB7B8;
  font-size: 14pt;
  margin: 0;
}
.footer {
  position: absolute;
  bottom: 30pt;
  text-align: center;
  width: 100%;
}
.date {
  color: #AAB7B8;
  font-size: 12pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="container">
  <div class="title-box">
    <h1>선진인포텍 ERP V1.0</h1>
    <p class="subtitle">Out-of-Scope 항목 정리</p>
    <p class="desc">Phase 1 구현 완료 및 Phase 2 로드맵</p>
  </div>
</div>
<div class="footer">
  <p class="date">2026년 1월 28일</p>
</div>
</body>
</html>
