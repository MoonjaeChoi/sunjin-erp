<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  background: #FFFFFF;
}
.accent-bar {
  position: absolute; top: 0; left: 0;
  width: 720pt; height: 6pt;
  background: #1ABC9C;
}
.container {
  width: 100%; height: 100%;
  padding: 25pt 35pt;
  box-sizing: border-box;
}
h1 {
  color: #1C2833;
  font-size: 22pt;
  font-weight: bold;
  margin: 10pt 0 18pt 0;
}
.three-col {
  display: flex;
  gap: 15pt;
}
.col {
  flex: 1;
}
.section-header-blue {
  background: #D6EAF8;
  padding: 8pt 10pt;
  border-radius: 4pt;
  margin-bottom: 10pt;
}
.section-header-blue p {
  color: #1A5276;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
  text-align: center;
}
.section-header-green {
  background: #D5F5E3;
  padding: 8pt 10pt;
  border-radius: 4pt;
  margin-bottom: 10pt;
}
.section-header-green p {
  color: #1E8449;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
  text-align: center;
}
.section-header-yellow {
  background: #FCF3CF;
  padding: 8pt 10pt;
  border-radius: 4pt;
  margin-bottom: 10pt;
}
.section-header-yellow p {
  color: #9A7D0A;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
  text-align: center;
}
.list-wrap {
  background: #F8F9FA;
  border-radius: 6pt;
  padding: 10pt;
}
ul {
  margin: 0;
  padding-left: 16pt;
  font-size: 9pt;
  color: #2E4053;
  line-height: 1.8;
}
li {
  margin-bottom: 3pt;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="container">
  <h1>Phase 2 주요 개발 항목</h1>
  <div class="three-col">
    <div class="col">
      <div class="section-header-blue"><p>공통 기능</p></div>
      <div class="list-wrap">
        <ul>
          <li>알림 시스템 (전체 모듈)</li>
          <li>다국어 지원 (i18n)</li>
          <li>부서별 권한 스코핑</li>
          <li>대량 import/export</li>
        </ul>
      </div>
    </div>
    <div class="col">
      <div class="section-header-green"><p>연동 기능</p></div>
      <div class="list-wrap">
        <ul>
          <li>외부 캘린더 연동 (Google, Outlook)</li>
          <li>이메일/SMS 알림</li>
          <li>SSO (LDAP/AD)</li>
          <li>외부 ERP 연동</li>
          <li>클라우드 스토리지 (S3)</li>
        </ul>
      </div>
    </div>
    <div class="col">
      <div class="section-header-yellow"><p>고급 기능</p></div>
      <div class="list-wrap">
        <ul>
          <li>간트 차트 (프로젝트)</li>
          <li>조직도 시각화 (직원)</li>
          <li>통계/분석 대시보드</li>
          <li>SLA 자동 계산 (장애)</li>
          <li>바코드/QR 스캔 (재고)</li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
