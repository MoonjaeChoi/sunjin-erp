<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #FFFFFF;
}
.accent-bar {
  position: absolute; top: 0; left: 0;
  width: 720pt; height: 6pt;
  background: #1ABC9C;
}
.container {
  width: 100%; height: 100%;
  padding: 30pt 35pt;
  box-sizing: border-box;
}
h1 {
  color: #1C2833;
  font-size: 24pt;
  font-weight: bold;
  margin: 10pt 0 20pt 0;
}
.three-col {
  display: flex;
  gap: 15pt;
}
.col {
  flex: 1;
}
.section-header-red {
  background: #FADBD8;
  padding: 8pt 10pt;
  border-radius: 4pt;
  margin-bottom: 10pt;
}
.section-header-red p {
  color: #C0392B;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
  text-align: center;
}
.section-header-yellow {
  background: #FCF3CF;
  padding: 8pt 10pt;
  border-radius: 4pt;
  margin-bottom: 10pt;
}
.section-header-yellow p {
  color: #9A7D0A;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
  text-align: center;
}
.section-header-green {
  background: #D5F5E3;
  padding: 8pt 10pt;
  border-radius: 4pt;
  margin-bottom: 10pt;
}
.section-header-green p {
  color: #1E8449;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
  text-align: center;
}
.list-wrap {
  background: #F8F9FA;
  border-radius: 6pt;
  padding: 12pt;
}
.item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 10pt;
}
.num {
  background: #2E4053;
  color: #FFFFFF;
  font-size: 9pt;
  font-weight: bold;
  width: 16pt;
  height: 16pt;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-right: 8pt;
  flex-shrink: 0;
}
.item-text {
  color: #2E4053;
  font-size: 10pt;
  margin: 0;
  line-height: 1.4;
}
.desc {
  color: #7F8C8D;
  font-size: 8pt;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="container">
  <h1>Phase 2 권장 우선순위</h1>
  <div class="three-col">
    <div class="col">
      <div class="section-header-red"><p>High Priority</p></div>
      <div class="list-wrap">
        <div class="item">
          <div class="num"><p>1</p></div>
          <p class="item-text"><b>알림 시스템</b><br><span class="desc">업무 효율성 직결</span></p>
        </div>
        <div class="item">
          <div class="num"><p>2</p></div>
          <p class="item-text"><b>부서별 권한 스코핑</b><br><span class="desc">보안 강화</span></p>
        </div>
        <div class="item">
          <div class="num"><p>3</p></div>
          <p class="item-text"><b>이메일/SMS 알림</b><br><span class="desc">고객 대응 속도 향상</span></p>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="section-header-yellow"><p>Medium Priority</p></div>
      <div class="list-wrap">
        <div class="item">
          <div class="num"><p>4</p></div>
          <p class="item-text"><b>외부 캘린더 연동</b><br><span class="desc">Google/Outlook</span></p>
        </div>
        <div class="item">
          <div class="num"><p>5</p></div>
          <p class="item-text"><b>통계/분석 대시보드</b><br><span class="desc">Recharts 시각화</span></p>
        </div>
        <div class="item">
          <div class="num"><p>6</p></div>
          <p class="item-text"><b>대량 import/export</b><br><span class="desc">CSV/Excel 지원</span></p>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="section-header-green"><p>Low Priority</p></div>
      <div class="list-wrap">
        <div class="item">
          <div class="num"><p>7</p></div>
          <p class="item-text"><b>다국어 지원</b><br><span class="desc">i18n 프레임워크</span></p>
        </div>
        <div class="item">
          <div class="num"><p>8</p></div>
          <p class="item-text"><b>WYSIWYG 에디터</b><br><span class="desc">TipTap/Slate</span></p>
        </div>
        <div class="item">
          <div class="num"><p>9</p></div>
          <p class="item-text"><b>클라우드 스토리지</b><br><span class="desc">S3 연동</span></p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
