<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #FFFFFF;
}
.accent-bar {
  position: absolute; top: 0; left: 0;
  width: 720pt; height: 6pt;
  background: #1ABC9C;
}
.container {
  width: 100%; height: 100%;
  padding: 30pt 35pt;
  box-sizing: border-box;
}
.header {
  display: flex;
  align-items: center;
  margin-bottom: 15pt;
}
.page-num {
  background: #1ABC9C;
  color: #FFFFFF;
  font-size: 12pt;
  font-weight: bold;
  padding: 6pt 12pt;
  border-radius: 4pt;
  margin-right: 12pt;
}
h1 {
  color: #1C2833;
  font-size: 20pt;
  font-weight: bold;
  margin: 0;
}
.two-col {
  display: flex;
  gap: 20pt;
}
.col {
  flex: 1;
}
.section-title-done {
  background: #D5F5E3;
  padding: 8pt 12pt;
  border-radius: 4pt;
  margin-bottom: 10pt;
}
.section-title-done p {
  color: #1E8449;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
}
.section-title-pending {
  background: #FADBD8;
  padding: 8pt 12pt;
  border-radius: 4pt;
  margin-bottom: 10pt;
}
.section-title-pending p {
  color: #C0392B;
  font-size: 12pt;
  font-weight: bold;
  margin: 0;
}
.table-wrap {
  background: #F8F9FA;
  border-radius: 6pt;
  padding: 8pt;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 9pt;
}
th {
  background: #2E4053;
  color: #FFFFFF;
  padding: 5pt 6pt;
  text-align: left;
  font-weight: bold;
}
td {
  padding: 4pt 6pt;
  border-bottom: 1pt solid #DEE2E6;
  color: #2E4053;
}
tr:last-child td {
  border-bottom: none;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="container">
  <div class="header">
    <div class="page-num"><p>Page 1</p></div>
    <h1>전체 레이아웃 설정 (PRD 2001)</h1>
  </div>
  <div class="two-col">
    <div class="col">
      <div class="section-title-done"><p>Phase 1 구현 완료</p></div>
      <div class="table-wrap">
        <table>
          <tr><th>항목</th><th>구현 내용</th></tr>
          <tr><td>모듈 페이지</td><td>11개 모듈 완료</td></tr>
          <tr><td>알림 시스템</td><td>Sonner 토스트 구현</td></tr>
          <tr><td>반응형</td><td>Sheet 오버레이 사이드바</td></tr>
          <tr><td>세션 관리</td><td>NextAuth.js JWT</td></tr>
        </table>
      </div>
    </div>
    <div class="col">
      <div class="section-title-pending"><p>Out-of-Scope (Phase 2)</p></div>
      <div class="table-wrap">
        <table>
          <tr><th>항목</th><th>비고</th></tr>
          <tr><td>다국어(i18n)</td><td>Phase 2</td></tr>
          <tr><td>다크 모드 토글</td><td>CSS 준비됨</td></tr>
          <tr><td>폼 임시 저장</td><td>Phase 2</td></tr>
          <tr><td>Lighthouse CI</td><td>안정화 후</td></tr>
          <tr><td>키보드 네비게이션</td><td>ARIA 강화</td></tr>
          <tr><td>즐겨찾기 메뉴</td><td>Phase 2</td></tr>
          <tr><td>PWA 지원</td><td>Phase 2</td></tr>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
