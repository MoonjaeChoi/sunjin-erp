<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  background: #1C2833;
}
.container {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.accent-bar {
  position: absolute; top: 0; left: 0;
  width: 8pt; height: 405pt;
  background: #1ABC9C;
}
.title-box {
  text-align: center;
  margin-bottom: 30pt;
}
h1 {
  color: #FFFFFF;
  font-size: 32pt;
  font-weight: bold;
  margin: 0 0 15pt 0;
}
.subtitle {
  color: #1ABC9C;
  font-size: 18pt;
  margin: 0 0 25pt 0;
}
.info-box {
  background: rgba(255, 255, 255, 0.1);
  padding: 20pt 40pt;
  border-radius: 8pt;
  text-align: center;
}
.info-box p {
  color: #AAB7B8;
  font-size: 12pt;
  margin: 8pt 0;
}
.highlight {
  color: #1ABC9C;
  font-weight: bold;
}
.footer {
  position: absolute;
  bottom: 30pt;
  text-align: center;
  width: 100%;
}
.date {
  color: #AAB7B8;
  font-size: 11pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="container">
  <div class="title-box">
    <h1>Thank You</h1>
    <p class="subtitle">Phase 1 완료 및 Phase 2 로드맵</p>
  </div>
  <div class="info-box">
    <p><span class="highlight">문서 버전:</span> v1.0</p>
    <p><span class="highlight">작성자:</span> Claude Code</p>
    <p><span class="highlight">작성일:</span> 2026-01-28</p>
  </div>
</div>
<div class="footer">
  <p class="date">선진인포텍 ERP V1.0 - Out-of-Scope 항목 정리</p>
</div>
</body>
</html>
