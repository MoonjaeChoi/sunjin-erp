<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #1C2833;
  padding: 20pt 35pt;
  display: flex;
  align-items: center;
}
.section-num {
  color: #3498DB;
  font-size: 12pt;
  font-weight: bold;
  margin-right: 15pt;
}
.section-title {
  color: #FFFFFF;
  font-size: 20pt;
  font-weight: bold;
  margin: 0;
}
.content {
  flex: 1;
  padding: 25pt 35pt;
  display: flex;
  gap: 25pt;
}
.center-box {
  width: 140pt;
  background: #1C2833;
  border-radius: 8pt;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20pt;
}
.center-title {
  color: #3498DB;
  font-size: 11pt;
  text-transform: uppercase;
  letter-spacing: 1pt;
  margin: 0 0 8pt 0;
  text-align: center;
}
.center-main {
  color: #FFFFFF;
  font-size: 18pt;
  font-weight: bold;
  text-align: center;
  margin: 0;
}
.benefits-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12pt;
}
.benefit-item {
  background: #F8F9FA;
  border-radius: 6pt;
  padding: 12pt 15pt;
  display: flex;
  align-items: flex-start;
  gap: 12pt;
}
.benefit-icon {
  background: #3498DB;
  color: #FFFFFF;
  width: 24pt;
  height: 24pt;
  border-radius: 12pt;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12pt;
  font-weight: bold;
  flex-shrink: 0;
}
.benefit-content {
  flex: 1;
}
.benefit-title {
  color: #1C2833;
  font-size: 11pt;
  font-weight: bold;
  margin: 0 0 4pt 0;
}
.benefit-text {
  color: #5D6D7E;
  font-size: 9pt;
  margin: 0;
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="header">
  <p class="section-num">02</p>
  <p class="section-title">ERP 도입 필요성</p>
</div>
<div class="content">
  <div class="benefits-col">
    <div class="benefit-item">
      <div class="benefit-icon"><p>1</p></div>
      <div class="benefit-content">
        <p class="benefit-title">업무 표준화</p>
        <p class="benefit-text">전사 업무 프로세스 표준화로 일관된 업무 수행 및 품질 향상</p>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon"><p>2</p></div>
      <div class="benefit-content">
        <p class="benefit-title">실시간 정보 공유</p>
        <p class="benefit-text">부서 간 데이터 실시간 연동으로 신속한 의사결정 지원</p>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon"><p>3</p></div>
      <div class="benefit-content">
        <p class="benefit-title">업무 효율성 향상</p>
        <p class="benefit-text">반복 업무 자동화로 핵심 업무 집중도 향상</p>
      </div>
    </div>
  </div>
  <div class="center-box">
    <p class="center-title">Integrated</p>
    <p class="center-main">ERP</p>
    <p class="center-title">System</p>
  </div>
  <div class="benefits-col">
    <div class="benefit-item">
      <div class="benefit-icon"><p>4</p></div>
      <div class="benefit-content">
        <p class="benefit-title">데이터 기반 경영</p>
        <p class="benefit-text">통합 데이터 분석으로 과학적 경영 의사결정 가능</p>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon"><p>5</p></div>
      <div class="benefit-content">
        <p class="benefit-title">비용 절감</p>
        <p class="benefit-text">중복 업무 제거 및 운영 비용 최적화</p>
      </div>
    </div>
    <div class="benefit-item">
      <div class="benefit-icon"><p>6</p></div>
      <div class="benefit-content">
        <p class="benefit-title">성장 기반 구축</p>
        <p class="benefit-text">확장 가능한 시스템으로 사업 성장 지원</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
